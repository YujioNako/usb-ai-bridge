name: Source tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v
      - name: Pi application fixtures (no device or AI account)
        run: |
          set -eu
          for test in pi/app/test-*.py; do python "$test"; done
  javascript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: node tests/test-panel.mjs
      - run: node tests/test-maintenance-http.mjs
      - run: node tests/test-login.mjs
      - run: powershell -File scripts/build_serial.ps1
